[project]
name = "telegram-desk"
version = "1.0.0"
description = "A safe, local-first Telegram web client built with FastAPI and Telethon"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiofiles==24.1.0",
    "fastapi==0.141.1",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.20",
    "telethon==1.44.0",
    "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "ruff==0.13.2",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
